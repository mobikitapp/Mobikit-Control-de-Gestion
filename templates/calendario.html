{% extends "base.html" %}

{% block title %}Calendario de Entregas - Mobikit{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-calendar-alt"></i> Calendario de Entregas</h1>
    <div class="btn-group" role="group">
        <input type="checkbox" class="btn-check" id="showOrdenes" checked>
        <label class="btn btn-outline-primary" for="showOrdenes">
            <i class="fas fa-file-invoice"></i> Órdenes de Compra
        </label>

        <input type="checkbox" class="btn-check" id="showDespachos" checked>
        <label class="btn btn-outline-danger" for="showDespachos">
            <i class="fas fa-truck"></i> Despachos
        </label>

        <input type="checkbox" class="btn-check" id="showUrgentes">
        <label class="btn btn-outline-warning" for="showUrgentes">
            <i class="fas fa-exclamation-triangle"></i> Solo Urgentes
        </label>
    </div>
</div>

<!-- Leyenda de colores -->
<div class="card mb-3">
    <div class="card-body py-2">
        <div class="row text-center">
            <div class="col-md-3">
                <small><span class="badge" style="background-color: #007bff;">Activo</span></small>
            </div>
            <div class="col-md-3">
                <small><span class="badge" style="background-color: #28a745;">Entregado</span></small>
            </div>
            <div class="col-md-3">
                <small><span class="badge" style="background-color: #dc3545;">Cancelado</span></small>
            </div>
            <div class="col-md-3">
                <small><span class="badge" style="background-color: #dc3545;">Urgente/Vencido</span></small>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div id="calendar"></div>
    </div>
</div>

<!-- Modal para detalles de orden de compra -->
<div class="modal fade" id="ordenModal" tabindex="-1">
    <div class="modal-dialog modal-xl"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ordenModalTitle">Detalle de Orden de Compra</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="ordenModalBody">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary" id="verProyectoBtn">
                    <i class="fas fa-eye"></i> Ver Proyecto
                </button>
                <button type="button" class="btn btn-success" id="verOrdenesBtn">
                    <i class="fas fa-industry"></i> Gestión Fabricación
                </button>
                <button type="button" class="btn btn-info" id="verOrdenCompraBtn">
                    <i class="fas fa-file-invoice"></i> Ver Orden Compra
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal para detalles de despacho -->
<div class="modal fade" id="despachoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="despachoModalTitle">Detalle de Despacho</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="despachoModalBody">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary" id="editarDespachoBtn">
                    <i class="fas fa-edit"></i> Editar Despacho
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.15/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    let calendar;
    let allEvents = [];

    // Inicializar FullCalendar
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: window.innerWidth <= 768 ? 'listWeek' : 'dayGridMonth',
        locale: 'es',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listWeek'
        },
        height: 'auto',
        editable: false,
        selectable: true,
        dayMaxEvents: 3,
        eventMaxStack: 3,

        // Cargar eventos
        events: function(info, successCallback, failureCallback) {
            loadCalendarEvents(successCallback, failureCallback);
        },

        // Manejar clic en evento
        eventClick: function(info) {
            showEventDetails(info.event);
        },

        // Configuración responsive
        windowResize: function() {
            if (window.innerWidth <= 768) {
                calendar.changeView('listWeek');
            } else {
                calendar.changeView('dayGridMonth');
            }
        },

        // Tooltip hover
        eventMouseEnter: function(info) {
            const props = info.event.extendedProps;
            const tooltip = document.createElement('div');
            tooltip.className = 'calendar-tooltip';
            tooltip.innerHTML = `
                <strong>${info.event.title}</strong><br>
                Cliente: ${props.cliente}<br>
                Estado: ${props.estado}<br>
                ${props.dias_restantes !== null ? `Días restantes: ${Math.round(props.dias_restantes)}` : ''}
            `;
            tooltip.style.cssText = `
                position: absolute;
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 8px;
                border-radius: 4px;
                font-size: 12px;
                z-index: 1000;
                pointer-events: none;
            `;
            document.body.appendChild(tooltip);

            info.el.addEventListener('mousemove', function(e) {
                tooltip.style.left = (e.pageX + 10) + 'px';
                tooltip.style.top = (e.pageY - 10) + 'px';
            });
        },

        eventMouseLeave: function(info) {
            const tooltip = document.querySelector('.calendar-tooltip');
            if (tooltip) {
                tooltip.remove();
            }
        }
    });

    calendar.render();

    // Función para cargar eventos del calendario
    function loadCalendarEvents(successCallback, failureCallback) {
        fetch('/api/calendar_events')
            .then(response => response.json())
            .then(data => {
                allEvents = data;
                const filteredEvents = filterEvents(data);
                successCallback(filteredEvents);
            })
            .catch(error => {
                console.error('Error cargando eventos:', error);
                failureCallback(error);
            });
    }

    // Filtrar eventos según los checkboxes
    function filterEvents(events) {
        const showOrdenes = document.getElementById('showOrdenes').checked;
        const showDespachos = document.getElementById('showDespachos').checked;
        const showUrgentes = document.getElementById('showUrgentes').checked;

        return events.filter(event => {
            // Filtro por tipo
            if (event.type === 'orden_compra' && !showOrdenes) return false;
            if (event.type === 'despacho' && !showDespachos) return false;

            // Filtro por urgencia
            if (showUrgentes && event.type === 'orden_compra') {
                return event.extendedProps.urgente === true;
            }

            return true;
        });
    }

    // Mostrar detalles del evento
    function showEventDetails(event) {
        const props = event.extendedProps;

        if (event.type === 'orden_compra') {
            showOrdenDetails(event, props);
        } else if (event.type === 'despacho') {
            showDespachoDetails(event, props);
        }
    }

    // Mostrar detalles de orden de compra
    function showOrdenDetails(event, props) {
        const modal = new bootstrap.Modal(document.getElementById('ordenModal'));
        const modalTitle = document.getElementById('ordenModalTitle');
        const modalBody = document.getElementById('ordenModalBody');
        const verProyectoBtn = document.getElementById('verProyectoBtn');
        const verOrdenesBtn = document.getElementById('verOrdenesBtn');

        modalTitle.innerHTML = `<i class="fas fa-file-invoice"></i> ${props.codigo} - ${props.proyecto}`;

        // Estado badge
        let estadoBadge = '';
        const estadoColors = {
            'en_desarrollo': 'info',
            'aprobado_produccion': 'primary', 
            'seccionado': 'warning',
            'enchapando': 'warning',
            'mecanizado': 'warning',
            'produccion_completa': 'info',
            'embalando': 'success',
            'listo_despacho': 'secondary'
        };
        const badgeColor = estadoColors[props.estado] || 'secondary';
        estadoBadge = `<span class="badge bg-${badgeColor}">${props.estado.replace('_', ' ').toUpperCase()}</span>`;

        // Urgencia
        let urgenciaInfo = '';
        if (props.dias_restantes !== null) {
            const dias = Math.round(props.dias_restantes);
            let urgenciaClass = 'text-success';
            let urgenciaText = `${dias} días restantes`;

            if (dias < 0) {
                urgenciaClass = 'text-danger';
                urgenciaText = `Vencido hace ${Math.abs(dias)} días`;
            } else if (dias === 0) {
                urgenciaClass = 'text-danger';
                urgenciaText = 'Entrega HOY';
            } else if (dias <= 3) {
                urgenciaClass = 'text-warning';
                urgenciaText = `URGENTE: ${dias} días restantes`;
            }

            urgenciaInfo = `<div class="alert alert-light border-start border-4 ${urgenciaClass.replace('text-', 'border-')} mb-3">
                <strong class="${urgenciaClass}"><i class="fas fa-clock"></i> ${urgenciaText}</strong>
            </div>`;
        }

        // Generar tabla de órdenes de fabricación
        let fabricacionTabla = '';
        if (props.ordenes_fabricacion && props.ordenes_fabricacion.length > 0) {
            fabricacionTabla = `
                <div class="mt-3">
                    <h6><i class="fas fa-industry text-warning"></i> Órdenes de Fabricación (${props.ordenes_fabricacion.length})</h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th>Código</th>
                                    <th>Tipo</th>
                                    <th>Estado</th>
                                    <th>Tableros</th>
                                    <th>Entrega Est.</th>
                                </tr>
                            </thead>
                            <tbody>
            `;
            
            props.ordenes_fabricacion.forEach(fab => {
                // Mapear estados a colores
                let estadoClass = 'secondary';
                let estadoTexto = fab.estado.replace(/_/g, ' ').toUpperCase();
                
                switch(fab.estado) {
                    case 'pendiente_aprobacion_diseño':
                        estadoClass = 'warning';
                        estadoTexto = 'PEND. APROB. DISEÑO';
                        break;
                    case 'aprobado_diseño':
                        estadoClass = 'info';
                        estadoTexto = 'APROBADO DISEÑO';
                        break;
                    case 'enviado_produccion':
                        estadoClass = 'primary';
                        estadoTexto = 'ENVIADO PRODUCCIÓN';
                        break;
                    case 'seccionado':
                        estadoClass = 'warning';
                        estadoTexto = 'SECCIONADO';
                        break;
                    case 'enchapando':
                        estadoClass = 'warning';
                        estadoTexto = 'ENCHAPANDO';
                        break;
                    case 'mecanizado':
                        estadoClass = 'warning';
                        estadoTexto = 'MECANIZADO';
                        break;
                    case 'pendiente_embalaje':
                        estadoClass = 'info';
                        estadoTexto = 'PEND. EMBALAJE';
                        break;
                    case 'embalando':
                        estadoClass = 'success';
                        estadoTexto = 'EMBALANDO';
                        break;
                    case 'embalaje_listo':
                        estadoClass = 'success';
                        estadoTexto = 'EMBALAJE LISTO';
                        break;
                    case 'listo_despacho':
                        estadoClass = 'dark';
                        estadoTexto = 'LISTO DESPACHO';
                        break;
                    case 'despachado':
                        estadoClass = 'primary';
                        estadoTexto = 'DESPACHADO';
                        break;
                    case 'entregado':
                        estadoClass = 'success';
                        estadoTexto = 'ENTREGADO';
                        break;
                }
                
                fabricacionTabla += `
                    <tr>
                        <td><strong>${fab.codigo_orden}</strong></td>
                        <td>${fab.tipo_orden || '-'}</td>
                        <td><span class="badge bg-${estadoClass}">${estadoTexto}</span></td>
                        <td>${fab.cantidad_tableros || '-'}</td>
                        <td>${fab.fecha_entrega_estimada ? new Date(fab.fecha_entrega_estimada).toLocaleDateString('es-ES') : '-'}</td>
                    </tr>
                `;
            });
            
            fabricacionTabla += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        modalBody.innerHTML = `
            ${urgenciaInfo}
            <div class="row">
                <div class="col-md-6">
                    <h6><i class="fas fa-info-circle text-primary"></i> Información General</h6>
                    <table class="table table-sm">
                        <tr><td><strong>Código:</strong></td><td>${props.codigo}</td></tr>
                        <tr><td><strong>Cliente:</strong></td><td>${props.cliente}</td></tr>
                        <tr><td><strong>Estado:</strong></td><td>${estadoBadge}</td></tr>
                        <tr><td><strong>Prioridad:</strong></td><td><span class="badge bg-${props.prioridad === 'alta' ? 'danger' : props.prioridad === 'media' ? 'warning' : 'secondary'}">${props.prioridad.toUpperCase()}</span></td></tr>
                        ${props.contacto_principal ? `<tr><td><strong>Contacto:</strong></td><td>${props.contacto_principal}</td></tr>` : ''}
                        ${props.diseñador ? `<tr><td><strong>Vendedor:</strong></td><td>${props.diseñador}</td></tr>` : ''}
                    </table>
                </div>
                <div class="col-md-6">
                    <h6><i class="fas fa-calendar text-success"></i> Fechas y Progreso</h6>
                    <table class="table table-sm">
                        <tr><td><strong>Fecha Entrega:</strong></td><td>${new Date(event.start).toLocaleDateString('es-ES')}</td></tr>
                        ${props.fecha_estimada_inicio ? `<tr><td><strong>Inicio Estimado:</strong></td><td>${new Date(props.fecha_estimada_inicio).toLocaleDateString('es-ES')}</td></tr>` : ''}
                        ${props.monto_neto ? `<tr><td><strong>Monto:</strong></td><td>$${props.monto_neto.toLocaleString('es-CL')}</td></tr>` : ''}
                        <tr><td><strong>Órdenes Fabric.:</strong></td><td><span class="badge bg-info">${props.ordenes_fabricacion_count}</span></td></tr>
                        ${props.categorias ? `<tr><td><strong>Categorías:</strong></td><td><small>${props.categorias}</small></td></tr>` : ''}
                    </table>
                </div>
            </div>
            ${fabricacionTabla}
            ${props.descripcion ? `
            <div class="mt-3">
                <h6><i class="fas fa-file-text text-info"></i> Descripción</h6>
                <p class="text-muted">${props.descripcion}</p>
            </div>` : ''}
        `;

        // Configurar botones
        const verOrdenCompraBtn = document.getElementById('verOrdenCompraBtn');
        
        verProyectoBtn.onclick = () => {
            window.open(`/proyecto/${props.proyecto_id}`, '_blank');
        };

        verOrdenesBtn.onclick = () => {
            window.open(`/ordenes_fabricacion`, '_blank');
        };

        verOrdenCompraBtn.onclick = () => {
            window.open(`/orden_compra/${props.proyecto_id}`, '_blank');
        };

        modal.show();
    }

    // Mostrar detalles de despacho
    function showDespachoDetails(event, props) {
        const modal = new bootstrap.Modal(document.getElementById('despachoModal'));
        const modalTitle = document.getElementById('despachoModalTitle');
        const modalBody = document.getElementById('despachoModalBody');
        const editarBtn = document.getElementById('editarDespachoBtn');

        modalTitle.innerHTML = `<i class="fas fa-truck"></i> ${props.codigo_despacho}`;

        modalBody.innerHTML = `
            <div class="row">
                <div class="col-12">
                    <table class="table">
                        <tr><td><strong>Proyecto:</strong></td><td>${props.proyecto}</td></tr>
                        <tr><td><strong>Cliente:</strong></td><td>${props.cliente}</td></tr>
                        <tr><td><strong>Estado:</strong></td><td><span class="badge bg-${props.estado === 'programado' ? 'secondary' : 'warning'}">${props.estado.toUpperCase()}</span></td></tr>
                        <tr><td><strong>Fecha:</strong></td><td>${new Date(event.start).toLocaleDateString('es-ES')}</td></tr>
                        ${props.transportista ? `<tr><td><strong>Transportista:</strong></td><td>${props.transportista}</td></tr>` : ''}
                        ${props.conductor ? `<tr><td><strong>Conductor:</strong></td><td>${props.conductor}</td></tr>` : ''}
                        ${props.direccion_entrega ? `<tr><td><strong>Dirección:</strong></td><td>${props.direccion_entrega}</td></tr>` : ''}
                    </table>
                </div>
            </div>
        `;

        editarBtn.onclick = () => {
            window.open(`/despacho/${props.despacho_id}`, '_blank');
        };

        modal.show();
    }

    // Event listeners para los filtros
    document.getElementById('showOrdenes').addEventListener('change', () => {
        calendar.refetchEvents();
    });

    document.getElementById('showDespachos').addEventListener('change', () => {
        calendar.refetchEvents();
    });

    document.getElementById('showUrgentes').addEventListener('change', () => {
        calendar.refetchEvents();
    });
});
</script>

<style>
.calendar-tooltip {
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    max-width: 200px;
    line-height: 1.4;
}

.fc-event {
    cursor: pointer;
    transition: all 0.2s ease;
}

.fc-event:hover {
    opacity: 0.8;
    transform: scale(1.02);
}

.fc-daygrid-event {
    font-size: 0.85em;
    margin-bottom: 2px;
}

.fc-list-event:hover {
    background-color: #f8f9fa;
}

@media (max-width: 768px) {
    .modal-dialog {
        margin: 0.5rem;
    }

    .fc-toolbar {
        flex-direction: column;
    }

    .fc-toolbar-chunk {
        margin: 0.2em 0;
    }
}
</style>
{% endblock %}
