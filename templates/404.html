{% extends "base.html" %}

{% block title %}Página No Encontrada - Sistema de Manufactura{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="py-5">
                <i data-feather="search" class="text-warning mb-4" style="width: 120px; height: 120px;"></i>
                <h1 class="display-4 fw-bold mb-3">404</h1>
                <h2 class="h4 mb-3">Página No Encontrada</h2>
                <p class="text-muted mb-4">
                    La página que estás buscando no existe o ha sido movida.
                    Verifica la URL o navega desde el menú principal.
                </p>
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{{ url_for('index') }}" class="btn btn-primary">
                        <i data-feather="home" class="me-2"></i>
                        Ir al Dashboard
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-secondary">
                        <i data-feather="arrow-left" class="me-2"></i>
                        Volver Atrás
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
