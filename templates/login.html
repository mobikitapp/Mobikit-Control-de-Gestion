
{% extends "base.html" %}

{% block title %}Login - Mobikit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <div class="mobikit-logo justify-content-center mb-2">
                    <div class="logo-icon"></div>
                    <h3 class="mb-0">Mobikit Control</h3>
                </div>
                <p class="text-muted">Sistema de Gestión de Fabricación de Muebles</p>
            </div>
            <div class="card-body">
                <!-- Repl Auth Login -->
                <div class="mb-3">
                    <button onclick="LoginWithReplit()" class="btn btn-success w-100 mb-3">
                        <i class="fas fa-code"></i> Iniciar Sesión con Replit
                    </button>
                </div>
                
                <hr class="my-4">
                <p class="text-center text-muted">O usar cuenta local</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>
                
                <div class="mt-4">
                    <h6>Usuarios de prueba:</h6>
                    <small class="text-muted">
                        Admin: admin / MobikitAdmin4026<br>
                        (Crear más usuarios desde el panel de administración)
                    </small>
                </div>
                
                <script>
                function LoginWithReplit() {
                    window.addEventListener("message", authComplete);
                    var h = 500;
                    var w = 350;
                    var left = screen.width / 2 - w / 2;
                    var top = screen.height / 2 - h / 2;

                    var authWindow = window.open(
                        "https://replit.com/auth_with_repl_site?domain=" + location.host,
                        "_blank",
                        "modal=yes, toolbar=no, location=no, directories=no, status=no, menubar=no, scrollbars=no, resizable=no, copyhistory=no, width=" +
                        w + ", height=" + h + ", top=" + top + ", left=" + left
                    );

                    function authComplete(e) {
                        if (e.data !== "auth_complete") {
                            return;
                        }

                        window.removeEventListener("message", authComplete);
                        authWindow.close();
                        location.reload();
                    }
                }
                </script>
            </div>
        </div>
    </div>
</div>
{% endblock %}
