
{% extends "base.html" %}

{% block title %}Login - Mobikit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <div class="mobikit-logo justify-content-center mb-2">
                    <div class="logo-icon"></div>
                    <h3 class="mb-0">Mobikit Control</h3>
                </div>
                <p class="text-muted">Sistema de Gestión de Fabricación de Muebles</p>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                </form>
                
                <div class="mt-4">
                    <h6>Usuarios de prueba:</h6>
                    <small class="text-muted">
                        Admin: admin / admin123<br>
                        (Crear más usuarios desde el panel de administración)
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
